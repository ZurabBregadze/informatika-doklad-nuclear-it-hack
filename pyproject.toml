[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doe-fresnel-synthesis"
version = "1.0.0"
description = "Learned multi-plane complex fields with Fresnel layers and GS comparison"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "Pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
doe-gs = "doe_p0.fresnel_baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["physical: analytical optics checks", "numerical: numerical operator checks", "software: API and reproducibility checks"]
